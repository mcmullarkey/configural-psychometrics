[package]
name = "configural"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Configural psychometrics: binary matrix validation and column-major packed-bit storage"

[dependencies]
libm = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "e2e"
harness = false
